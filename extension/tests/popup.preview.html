<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Popup preview</title>
<style>
  body { margin: 0; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; background: #cfd6e4; }
  #frame { width: 360px; margin: 20px auto; background: #eff2f9; border-radius: 10px;
           box-shadow: 0 10px 30px rgba(0,0,0,.25); overflow: hidden; }
  #log { position: fixed; right: 12px; top: 12px; width: 340px; font-size: 11px;
         background: #fff; padding: 10px 12px; border-radius: 8px; max-height: 90vh;
         overflow: auto; font-family: ui-monospace, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="frame"></div>
<div id="log">calls to the archive:\n</div>

<script>
/* Stand-in for the extension runtime, so the real popup can be rendered and
   driven outside Chrome. Only the surfaces popup.js actually uses. */
const log = (msg) => { document.getElementById("log").textContent += msg + "\n"; };

const FAKE_PAGE = {
  source: {
    url: "https://www.dezeen.com/2024/inflated-garment",
    canonical_url: "https://www.dezeen.com/2024/inflated-garment",
    domain: "dezeen.com",
    page_title: "Inflated garment study explores protective architecture",
    captured_at: new Date().toISOString(),
  },
  metadata: { title: "Inflated Form", creator: "A Designer", date: "2024" },
  provenance: [
    { field: "title", value: "Inflated Form", source: "json-ld", confidence: "high" },
    { field: "creator", value: "A Designer", source: "json-ld", confidence: "high" },
    { field: "description", value: "A study in inflated protective form.", source: "opengraph", confidence: "high" },
    { field: "caption", value: "Look 12, photographed by the studio", source: "figcaption", confidence: "medium" },
    { field: "date", value: "2024", source: "nearby-text", confidence: "low" },
  ],
  extractor: "generic",
  selection: {
    selected_text: "The garment functions as an architectural enclosure around the body.",
    context: "A longer surrounding paragraph giving context to the quotation.",
    heading: "Enclosure",
  },
  images: [
    { index: 0, image_url: swatch("#8d99ae"), original_image_url: null, image_alt: "an inflated garment", caption: "Look 12", credit: "", width: 1600, height: 1200, score: 88, kind: "img" },
    { index: 1, image_url: swatch("#b8b8aa"), original_image_url: null, image_alt: "detail of seam", caption: "", credit: "", width: 1200, height: 1600, score: 74, kind: "img" },
    { index: 2, image_url: swatch("#6d6875"), original_image_url: null, image_alt: "", caption: "", credit: "", width: 900, height: 900, score: 61, kind: "img" },
    { index: 3, image_url: swatch("#c9ada7"), original_image_url: null, image_alt: "", caption: "", credit: "", width: 800, height: 600, score: 55, kind: "social-card" },
  ],
  pdfs: [
    // Same-origin with the page, as a paywalled article's own PDF endpoint
    // would be -- so this exercises the content-script download path that
    // carries the session and referrer.
    { index: 0, title: "Enclosure Study — Full Paper.pdf", source: "citation-meta",
      pdf_url: "https://www.dezeen.com/stable/pdf/enclosure-study.pdf" },
    { index: 1, title: "Supplementary figures.pdf", source: "link",
      pdf_url: "https://cdn.other-host.test/supplementary.pdf" },
  ],
};

function swatch(colour) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><rect width="120" height="120" fill="${colour}"/></svg>`;
  return "data:image/svg+xml;base64," + btoa(svg);
}

window.chrome = {
  storage: {
    sync: {
      _data: { endpoint: "http://127.0.0.1:5050", token: "", recentProjects: ["p2"], lastProjectId: "p2" },
      async get(defaults) { return { ...defaults, ...this._data }; },
      async set(patch) { Object.assign(this._data, patch); log("storage.set " + JSON.stringify(patch)); },
    },
  },
  tabs: {
    async query() {
      return [{ id: 1, title: FAKE_PAGE.source.page_title, url: FAKE_PAGE.source.url }];
    },
    sendMessage(_tabId, message, cb) {
      log("→ page: " + message.type);
      setTimeout(() => {
        if (message.type === "describe-page") cb({ ok: true, page: FAKE_PAGE });
        else if (message.type === "envelope-pdf") {
          const pdf = FAKE_PAGE.pdfs[message.index];
          cb({ ok: true, envelope: { type: "pdf", source: FAKE_PAGE.source,
            content: { image_url: pdf.pdf_url, image_alt: pdf.title },
            metadata: {}, metadata_provenance: [], project_ids: [], user_note: "" } });
        }
        else if (message.type === "download-same-origin") {
          // The real content script refuses anything cross-origin so the
          // caller falls back to the background worker; the fixture PDF
          // below is on a different host, so that's the path exercised here.
          const sameOrigin = (() => {
            try { return new URL(message.url, FAKE_PAGE.source.url).origin === new URL(FAKE_PAGE.source.url).origin; }
            catch { return false; }
          })();
          cb(sameOrigin
            ? { ok: true, dataUrl: swatch("#8d99ae"), type: "image/svg+xml", size: 200 }
            : { ok: false, error: "not same-origin", crossOrigin: true });
        }
        else if (message.type.startsWith("envelope-")) cb({ ok: true, envelope: { type: "image", source: FAKE_PAGE.source, content: { image_url: "https://x/1.jpg" }, metadata: {}, metadata_provenance: [], project_ids: [], user_note: "" } });
        else cb({ ok: false, error: "unknown" });
      }, 30);
    },
  },
  scripting: {
    async executeScript({ func }) { return [{ result: func ? true : undefined }]; },
  },
  runtime: {
    lastError: null,
    // Stands in for the background service worker's "download-image"
    // handler, which is what popup.js now asks to fetch image bytes --
    // fetching from the popup itself was dropped because Chrome tears the
    // popup down the instant it loses focus, aborting anything in flight.
    sendMessage(message, cb) {
      log("→ background: " + message.type);
      setTimeout(() => cb({ ok: true, dataUrl: swatch("#8d99ae"), type: "image/svg+xml", size: 200 }), 30);
    },
  },
};

/* Pretend archive, so the real api.js paths are exercised. */
const realFetch = window.fetch.bind(window);
window.fetch = async (url, opts = {}) => {
  if (typeof url === "string" && url.startsWith("data:")) return realFetch(url, opts);
  const path = String(url).replace("http://127.0.0.1:5050", "");
  log(`→ archive: ${opts.method || "GET"} ${path}`);
  const reply = (body, status = 200) =>
    new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });

  if (path === "/api/health") return reply({ ok: true, reference_count: 60, auth_required: false });
  if (path === "/api/projects") return reply([
    { id: "p1", title: "AW26", reference_count: 12 },
    { id: "p2", title: "Material Research", reference_count: 30 },
    { id: "p3", title: "Silhouette Research", reference_count: 8 },
  ]);
  if (path === "/api/captures/check") return reply({ duplicate: false, match: null });
  if (path === "/api/captures") return reply({ capture_id: "c1", status: "queued", reference_id: null }, 202);
  if (path === "/api/captures/batch") {
    // Echo one result per submitted capture, as the real endpoint does, with
    // the last one failing so the mixed-outcome rendering is exercised.
    const sent = JSON.parse(opts.body.get("captures"));
    const results = sent.map((_, i) =>
      i === sent.length - 1
        ? { ok: false, error: "image responded 403" }
        : { ok: true, capture_id: `c${i}`, status: "queued" }
    );
    return reply({ accepted: results.filter((r) => r.ok).length, total: results.length, results }, 202);
  }
  return reply({ error: "not found" }, 404);
};

/* Load the real popup markup, then the real popup module. */
(async () => {
  const html = await realFetch("../src/popup/popup.html").then((r) => r.text());
  const parsed = new DOMParser().parseFromString(html, "text/html");

  const css = document.createElement("link");
  css.rel = "stylesheet";
  css.href = "../src/styles/popup.css";
  document.head.appendChild(css);

  document.getElementById("frame").innerHTML = parsed.body.innerHTML;
  // Drop the module tag the parsed markup carries; import it explicitly so the
  // shims above are guaranteed to be in place first.
  document.querySelectorAll("#frame script").forEach((s) => s.remove());
  await import("../src/popup/popup.js");
  log("popup module loaded");
})();
</script>
</body>
</html>
